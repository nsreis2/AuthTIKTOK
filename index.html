<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipForge AI — Autorização TikTok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2b3040;
      --text: #f0f3f8;
      --text-muted: #9aa2b5;
      --primary: #4f46e5;
      --accent: #00f2fe;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent);
      margin-bottom: 20px;
    }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
    .status-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      word-break: break-all;
    }
    .btn-return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn-return:hover { opacity: 0.9; }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.298-.002.595.042.88.13V9.4a6.33 6.33 0 0 0-1-.08A6.34 6.34 0 0 0 3 15.66a6.34 6.34 0 0 0 10.82 4.47 6.27 6.27 0 0 0 1.96-4.51V8.75a8.17 8.17 0 0 0 4.79 1.52V6.85c-.33-.04-.66-.1-.98-.16z"/></svg>
    </div>

    <div class="spinner" id="spinner"></div>

    <h1 id="titleText">Autorização do TikTok Recebida!</h1>
    <p id="descText">Redirecionando os dados de autorização de volta para o seu ClipForge AI local...</p>

    <div class="status-box" id="statusBox">
      Aguardando processamento dos parâmetros de autorização...
    </div>

    <a href="#" id="btnManualRedirect" class="btn-return" style="display:none;">
      👉 Concluir Conexão no ClipForge AI
    </a>
  </div>

  <script>
    (function() {
      // 1. Extrai os parâmetros retornados pelo TikTok
      const searchParams = window.location.search;
      const targetLocalUrl = 'http://localhost:3000/api/tiktok/oauth-callback' + searchParams;

      const statusBox = document.getElementById('statusBox');
      const btnManual = document.getElementById('btnManualRedirect');
      const spinner = document.getElementById('spinner');
      const titleText = document.getElementById('titleText');
      const descText = document.getElementById('descText');

      if (!searchParams || (!searchParams.includes('code=') && !searchParams.includes('error='))) {
        spinner.style.display = 'none';
        titleText.textContent = 'Página Bridge do TikTok OAuth';
        descText.textContent = 'Esta página funciona como ponte HTTPS para o ClipForge AI rodando localmente.';
        statusBox.textContent = 'Nenhum código de autorização foi detectado na URL. Inicie a autorização a partir do ClipForge AI.';
        return;
      }

      btnManual.href = targetLocalUrl;
      statusBox.innerHTML = 'Código detectado com sucesso!<br>Destino local: <code style="color:#00f2fe;">' + targetLocalUrl + '</code>';

      // 2. Tenta redirecionamento automático
      try {
        window.location.href = targetLocalUrl;
      } catch (e) {
        console.warn('Redirecionamento automático bloqueado:', e);
      }

      // 3. Exibe botão de clique manual caso o navegador bloqueie navegação HTTPS -> HTTP local (CORS/Private Network)
      setTimeout(function() {
        spinner.style.display = 'none';
        btnManual.style.display = 'inline-flex';
        descText.textContent = 'Clique no botão abaixo para finalizar a conexão com seu ClipForge AI:';
      }, 800);
    })();
  </script>
</body>
</html>
